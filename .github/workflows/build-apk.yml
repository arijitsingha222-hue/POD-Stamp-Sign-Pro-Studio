name: Build POD Stamp Sign Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and Fix Upload, Download & Assets
        run: |
          mkdir -p extracted
          unzip -q POD_Stamp_Sign_Pro_Studio_Android_Project.zip -d extracted

          # যদি repo-তে নতুন index.html থাকে তবে সেটি assets-এ কপি করবে
          if [ -f "index.html" ]; then
            mkdir -p extracted/PODStampSignProStudio-Android/app/src/main/assets
            cp -f index.html extracted/PODStampSignProStudio-Android/app/src/main/assets/index.html
          fi

          rm -rf extracted/PODStampSignProStudio-Android/app/src/main/java
          mkdir -p extracted/PODStampSignProStudio-Android/app/src/main/java/com/geetanjali/podstampsignpro

          sed -i 's/in\.geetanjali\.podstampsignpro/com.geetanjali.podstampsignpro/g' extracted/PODStampSignProStudio-Android/app/src/main/AndroidManifest.xml
          sed -i 's/in\.geetanjali\.podstampsignpro/com.geetanjali.podstampsignpro/g' extracted/PODStampSignProStudio-Android/app/build.gradle

          python3 -c '
          import textwrap
          code = """package com.geetanjali.podstampsignpro

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.Toast
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              inner class AndroidDownloader(private val ctx: Context) {
                  @JavascriptInterface
                  fun saveFile(dataUrl: String, fileName: String, mimeType: String) {
                      try {
                          val base64Data = if (dataUrl.contains(",")) dataUrl.substringAfter(",") else dataUrl
                          val bytes = Base64.decode(base64Data, Base64.DEFAULT)
                          val safeName = if (fileName.isBlank()) "POD_Stamped_${System.currentTimeMillis()}.jpg" else fileName
                          val resolvedMime = when {
                              safeName.endsWith(".pdf", true) -> "application/pdf"
                              safeName.endsWith(".png", true) -> "image/png"
                              else -> if (mimeType.isBlank()) "image/jpeg" else mimeType
                          }

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              val values = ContentValues().apply {
                                  put(MediaStore.Downloads.DISPLAY_NAME, safeName)
                                  put(MediaStore.Downloads.MIME_TYPE, resolvedMime)
                                  put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                                  put(MediaStore.Downloads.IS_PENDING, 1)
                              }
                              val resolver = ctx.contentResolver
                              val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                              if (uri != null) {
                                  resolver.openOutputStream(uri)?.use { it.write(bytes) }
                                  values.clear()
                                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                                  resolver.update(uri, values, null, null)
                              }
                          } else {
                              val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              if (!dir.exists()) dir.mkdirs()
                              val outFile = File(dir, safeName)
                              FileOutputStream(outFile).use { it.write(bytes) }
                              MediaScannerConnection.scanFile(ctx, arrayOf(outFile.absolutePath), arrayOf(resolvedMime), null)
                          }

                          runOnUiThread {
                              Toast.makeText(ctx, "Saved in Downloads: $safeName", Toast.LENGTH_LONG).show()
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(ctx, "Save failed: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val container = FrameLayout(this).apply {
                      fitsSystemWindows = true
                  }
                  webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      allowFileAccessFromFileURLs = true
                      allowUniversalAccessFromFileURLs = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }
                  webView.addJavascriptInterface(AndroidDownloader(this), "AndroidDownloader")
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePathCallback

                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                              putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "application/pdf"))
                          }
                          try {
                              startActivityForResult(Intent.createChooser(intent, "Select POD Image or PDF"), 1001)
                          } catch (e: ActivityNotFoundException) {
                              this@MainActivity.filePathCallback = null
                              Toast.makeText(this@MainActivity, "No file manager found", Toast.LENGTH_SHORT).show()
                              return false
                          }
                          return true
                      }
                  }
                  webView.setDownloadListener { url, _, contentDisposition, mimeType, _ ->
                      val guessedName = URLUtil.guessFileName(url, contentDisposition, mimeType)
                      if (url.startsWith("data:")) {
                          AndroidDownloader(this).saveFile(url, guessedName, mimeType ?: "image/jpeg")
                      } else if (url.startsWith("blob:")) {
                          val safeUrl = url.replace("\x27", "")
                          val safeMime = (mimeType ?: "image/jpeg").replace("\x27", "")
                          val js = "(function(){fetch(\x27$safeUrl\x27).then(r=>r.blob()).then(b=>{var rd=new FileReader();rd.onloadend=function(){AndroidDownloader.saveFile(rd.result,\x27POD_Stamped_\x27+Date.now()+\x27.jpg\x27,\x27$safeMime\x27);};rd.readAsDataURL(b);});})();"
                          webView.evaluateJavascript(js, null)
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
                  container.addView(webView)
                  setContentView(container)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 1001) {
                      val results: Array<Uri>? = when {
                          resultCode != RESULT_OK || data == null -> null
                          data.data != null -> arrayOf(data.data!!)
                          data.clipData != null && data.clipData!!.itemCount > 0 -> arrayOf(data.clipData!!.getItemAt(0).uri)
                          else -> null
                      }
                      filePathCallback?.onReceiveValue(results)
                      filePathCallback = null
                  }
                  super.onActivityResult(requestCode, resultCode, data)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          """
          with open("extracted/PODStampSignProStudio-Android/app/src/main/java/com/geetanjali/podstampsignpro/MainActivity.kt", "w") as f:
              f.write(textwrap.dedent(code).lstrip())
          '

          python3 -c '
          import textwrap
          gradle_code = """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          with open("extracted/PODStampSignProStudio-Android/app/build.gradle", "a") as f:
              f.write(textwrap.dedent(gradle_code))
          '

      - name: Build Debug APK
        run: |
          cd extracted/PODStampSignProStudio-Android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POD-Stamp-Sign-Pro-APK
          path: extracted/PODStampSignProStudio-Android/app/build/outputs/apk/debug/*.apk
          ct@v4
        with:
          name: POD-Stamp-Sign-Pro-APK
          path: extracted/PODStampSignProStudio-Android/app/build/outputs/apk/debug/*.apk
          
