name: Build POD Stamp Sign Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and Repair Config
        run: |
          mkdir -p extracted
          unzip -q POD_Stamp_Sign_Pro_Studio_Android_Project.zip -d extracted

          # বিল্ট-ইন Activity ব্যবহার করে MainActivity.kt তৈরি (কোনো এক্সটার্নাল লাইব্রেরি ছাড়াই)
          mkdir -p extracted/PODStampSignProStudio-Android/app/src/main/java/in/geetanjali/podstampsignpro
          cat << 'EOF' > extracted/PODStampSignProStudio-Android/app/src/main/java/in/geetanjali/podstampsignpro/MainActivity.kt
          package in.geetanjali.podstampsignpro

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.content.Intent

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePathCallback
                          val intent = fileChooserParams?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(intent, 1001)
                          return true
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 1001) {
                      val results = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      filePathCallback?.onReceiveValue(results)
                      filePathCallback = null
                  }
                  super.onActivityResult(requestCode, resultCode, data)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # Gradle Java 17 কনফিগারেশন
          cat << 'EOF' >> extracted/PODStampSignProStudio-Android/app/build.gradle

          android {
              namespace "in.geetanjali.podstampsignpro"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd extracted/PODStampSignProStudio-Android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POD-Stamp-Sign-Pro-APK
          path: extracted/PODStampSignProStudio-Android/app/build/outputs/apk/debug/*.apk
          
