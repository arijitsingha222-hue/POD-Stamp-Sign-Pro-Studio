name: Build POD Stamp Sign Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract, Overwrite & Repair
        run: |
          mkdir -p extracted
          unzip -q POD_Stamp_Sign_Pro_Studio_Android_Project.zip -d extracted

          # ভুল packages বা old kotlin/java ফাইল পুরোপুরি মুছে দিন যাতে ডুপ্লিকেট না থাকে
          rm -rf extracted/PODStampSignProStudio-Android/app/src/main/java/in/geetanjali/podstampsignpro
          rm -rf extracted/PODStampSignProStudio-Android/app/src/main/java/in/geetanjali/pod_stamp_sign_pro
          rm -rf extracted/PODStampSignProStudio-Android/app/src/main/java/in/geetanjali/POD_Stamp_Sign_Pro_Studio_Android_Project
          
          # নতুন সঠিক ডিরেক্টরি স্ট্রাকচার তৈরি করুন
          mkdir -p extracted/PODStampSignProStudio-Android/app/src/main/java/in/geetanjali/podstampsignpro

          # একেবারে নতুন MainActivity.kt ফাইল সঠিক প্যাকেজে বসান (AppCompatActivity ও AndroidX সাপোর্ট ছাড়া সরাসরি)
          cat << 'EOF' > extracted/PODStampSignProStudio-Android/app/src/main/java/in/geetanjali/podstampsignpro/MainActivity.kt
          package in.geetanjali.podstampsignpro

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePathCallback
                          val intent = fileChooserParams?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(intent, 1001)
                          return true
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 1001) {
                      val results = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      filePathCallback?.onReceiveValue(results)
                      filePathCallback = null
                  }
                  super.onActivityResult(requestCode, resultCode, data)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # ভুল namespace এরর এড়াতে gradle ওভাররাইট করা
          cat << 'EOF' > extracted/PODStampSignProStudio-Android/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'in.geetanjali.podstampsignpro'
              compileSdk 34

              defaultConfig {
                  applicationId "in.geetanjali.podstampsignpro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
          }
          EOF

          # settings.gradle ফিক্সিং (ভুল সাব ফোল্ডার রেফারেন্স বা নাম থাকলে ড্যামেজ ঠিক করার জন্য)
          cat << 'EOF' > extracted/PODStampSignProStudio-Android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PODStampSignProStudio"
          include ':app'
          EOF

      - name: Build Debug APK
        run: |
          cd extracted/PODStampSignProStudio-Android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POD-Stamp-Sign-Pro-APK
          path: extracted/PODStampSignProStudio-Android/app/build/outputs/apk/debug/*.apk
          
