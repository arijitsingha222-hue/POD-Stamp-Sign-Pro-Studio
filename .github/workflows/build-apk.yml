name: Build POD Stamp Sign Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Latest ZIP and Build Debug APK
        run: |
          mkdir -p extracted
          LATEST_ZIP=$(ls -t *1.zip *_2.zip *Project*.zip 2>/dev/null | head -n 1)
          echo "Using ZIP file: $LATEST_ZIP"
          unzip -q "$LATEST_ZIP" -d extracted
          cd extracted/PODStampSignProStudio-Android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POD-Stamp-Sign-Pro-APK
          path: extracted/PODStampSignProStudio-Android/app/build/outputs/apk/debug/*.apk
          
